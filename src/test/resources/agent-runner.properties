# ------------------------------------------------------------
# Выбор активного CLI (= имя его исполняемого файла).
# ------------------------------------------------------------
agent.cli=qwen

# ------------------------------------------------------------
# Таймаут выполнения агента (в минутах). Необязательно.
# Если не задан — используется значение по умолчанию (15 минут).
# ------------------------------------------------------------
#agent.timeout=15

# ------------------------------------------------------------
# Песочница. Необязательно (по умолчанию выключена).
# true  — агент работает во временной копии проекта; наружу писать нельзя,
#         читать можно всё. Копия удаляется после запуска, diff изменений
#         сохраняется рядом с логом (<buildDir>/agentic-cli-runner/<runId>.diff).
# ------------------------------------------------------------
agent.sandbox=false
# Жёсткий запрет записи средствами ОС (sandbox-exec/bwrap/firejail). По умолчанию true.
# На ОС без поддержки (Windows) слой автоматически отключается.
#agent.sandbox.os-enforcement=true
# Что не копировать в песочницу (через запятую). Каталог конфига CLI (.qwen и т.п.)
# не исключается никогда. По умолчанию: .git,.idea,node_modules,target,build,dist,.gradle
#agent.sandbox.exclude=.git,.idea,node_modules,target,build,dist,.gradle

# ------------------------------------------------------------
# Qwen Code  (активен)
# ------------------------------------------------------------
agent.cli.qwen.args=--output-format,stream-json,--approval-mode,yolo
agent.cli.qwen.prefix.windows=cmd,/c
agent.cli.qwen.fallback.mac=${env.HOME}/.local/bin
agent.cli.qwen.fallback.linux=${env.HOME}/.local/bin

